apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
type: Opaque
stringData:
  # This will be manually updated after PostgreSQL is deployed
  # Format: postgresql://user:password@host:port/database
  database-url: "postgresql://{{ .Values.database.user }}:CHANGE_ME@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
