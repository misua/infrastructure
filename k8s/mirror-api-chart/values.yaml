replicaCount: 2

image:
  repository: mirrorapiregistry123.azurecr.io/mirror-api
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 4004

ingress:
  enabled: true
  className: nginx
  host: ""  # Will use the ingress IP

database:
  host: postgres-cluster-rw  # CloudNativePG service name
  port: 5432
  name: mirrordb
  user: postgres
  # Password will come from secret
